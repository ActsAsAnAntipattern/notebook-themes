name: Validate themes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fontTools for font checks
        run: python3 -m pip install fonttools==4.55.3
      - name: Validate themes and check index.json
        run: python3 scripts/build_index.py --check
